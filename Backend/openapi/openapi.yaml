openapi: 3.0.3
info:
  title: Hotel Employee Management System
  description: |
    REST API for managing hotel staff — employees, departments, roles, shifts,
    attendance — with JWT-based RBAC and audit logging.

    ## Authentication
    1. `POST /auth/login` with username + password to get an access token.
    2. Pass the token as `Authorization: Bearer <token>` on all protected endpoints.

    ## Roles
    | Role | Access |
    |------|--------|
    | `super_admin` | Everything, including user management and audit logs |
    | `hr_manager` | Employees, departments, roles, shifts, attendance, reports |
    | `staff` | Own profile, own attendance, own shifts (stretch) |
  version: 1.0.0
  contact:
    name: Hotel EMS

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Login and token refresh
  - name: Employees
    description: Employee CRUD and role/department reassignment
  - name: Departments
    description: Department CRUD
  - name: Roles
    description: Role CRUD
  - name: Shifts
    description: Shift template CRUD
  - name: Shift Assignments
    description: Assign employees to shifts on specific dates
  - name: Attendance
    description: Check-in / check-out and per-employee attendance records
  - name: Reports
    description: Attendance summary, department staffing, shift coverage gaps
  - name: Users
    description: User account management (super_admin only)
  - name: Audit Logs
    description: Append-only audit trail (super_admin + hr_manager)

paths:
  # ─── Auth ─────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login and get JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Employees ────────────────────────────────────────
  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees
      security:
        - bearerAuth: []
      parameters:
        - name: department_id
          in: query
          schema:
            type: integer
            format: int64
          description: Filter by department ID
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EmployeeStatus'
          description: Filter by status
      responses:
        '200':
          description: Employee list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_EmployeeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Create a new employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /employees/{id}:
    parameters:
      - $ref: '#/components/parameters/EmployeeID'

    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Get employee by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Employee with joined department and current role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Employees]
      operationId: updateEmployee
      summary: Update an employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Employees]
      operationId: deleteEmployee
      summary: Delete an employee
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /employees/{id}/department:
    parameters:
      - $ref: '#/components/parameters/EmployeeID'

    post:
      tags: [Employees]
      operationId: updateEmployeeDepartment
      summary: Reassign employee to a different department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department_id]
              properties:
                department_id:
                  type: integer
                  format: int64
                  description: ID of the department to assign
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /employees/{id}/role:
    parameters:
      - $ref: '#/components/parameters/EmployeeID'

    post:
      tags: [Employees]
      operationId: reassignRole
      summary: |
        Reassign employee to a different role (atomic — closes old role, opens
        new one, writes audit log, all in one transaction).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: integer
                  format: int64
                  description: ID of the role to assign
      responses:
        '200':
          description: Role reassigned, returns updated employee with new current role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Departments ──────────────────────────────────────
  /departments:
    get:
      tags: [Departments]
      operationId: listDepartments
      summary: List all departments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_DepartmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Departments]
      operationId: createDepartment
      summary: Create a new department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /departments/{id}:
    parameters:
      - $ref: '#/components/parameters/DepartmentID'

    get:
      tags: [Departments]
      operationId: getDepartment
      summary: Get department by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Departments]
      operationId: updateDepartment
      summary: Update a department
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
      responses:
        '200':
          description: Updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Departments]
      operationId: deleteDepartment
      summary: Delete a department
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Roles ────────────────────────────────────────────
  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List all roles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_RoleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Roles]
      operationId: createRole
      summary: Create a new role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/RoleID'

    get:
      tags: [Roles]
      operationId: getRole
      summary: Get role by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Roles]
      operationId: updateRole
      summary: Update a role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Roles]
      operationId: deleteRole
      summary: Delete a role
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Shifts ───────────────────────────────────────────
  /shifts:
    get:
      tags: [Shifts]
      operationId: listShifts
      summary: List all shift templates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shift list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_ShiftList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Shifts]
      operationId: createShift
      summary: Create a new shift template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftRequest'
      responses:
        '201':
          description: Shift created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Shift'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /shifts/{id}:
    parameters:
      - $ref: '#/components/parameters/ShiftID'

    get:
      tags: [Shifts]
      operationId: getShift
      summary: Get shift by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Shift'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Shifts]
      operationId: updateShift
      summary: Update a shift template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShiftRequest'
      responses:
        '200':
          description: Updated shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Shift'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Shifts]
      operationId: deleteShift
      summary: Delete a shift template
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Shift Assignments ────────────────────────────────
  /shift-assignments:
    get:
      tags: [Shift Assignments]
      operationId: listShiftAssignments
      summary: List shift assignments with optional filters
      security:
        - bearerAuth: []
      parameters:
        - name: employee_id
          in: query
          schema:
            type: integer
            format: int64
        - name: shift_id
          in: query
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
      responses:
        '200':
          description: Shift assignment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_ShiftAssignmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Shift Assignments]
      operationId: createShiftAssignment
      summary: Assign an employee to a shift on a specific date
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftAssignmentRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_ShiftAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Employee already assigned to a shift on that date

  /shift-assignments/{id}:
    parameters:
      - $ref: '#/components/parameters/ShiftAssignmentID'

    delete:
      tags: [Shift Assignments]
      operationId: deleteShiftAssignment
      summary: Remove a shift assignment
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /employees/{id}/shifts:
    parameters:
      - $ref: '#/components/parameters/EmployeeID'

    get:
      tags: [Shift Assignments]
      operationId: listEmployeeShifts
      summary: List shift assignments for a specific employee
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shift assignment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_ShiftAssignmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Attendance ───────────────────────────────────────
  /attendance/check-in:
    post:
      tags: [Attendance]
      operationId: checkIn
      summary: Check in for a shift assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Attendance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Shift assignment not found
        '422':
          $ref: '#/components/responses/InvalidState'
          description: Already checked in

  /attendance/check-out:
    post:
      tags: [Attendance]
      operationId: checkOut
      summary: Check out from a shift assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
      responses:
        '200':
          description: Checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Attendance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidState'
          description: Not checked in yet, or already checked out

  /employees/{id}/attendance:
    parameters:
      - $ref: '#/components/parameters/EmployeeID'

    get:
      tags: [Attendance]
      operationId: listEmployeeAttendance
      summary: List attendance records for an employee
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
      responses:
        '200':
          description: Attendance list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_AttendanceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Reports ──────────────────────────────────────────
  /reports/attendance-summary:
    get:
      tags: [Reports]
      operationId: attendanceSummary
      summary: Monthly attendance summary per employee
      description: |
        Aggregates attendance status counts (present/late/absent/half_day) and
        computes an attendance rate percentage per employee for the given date range.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
      responses:
        '200':
          description: Attendance summary data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_MonthlyAttendanceSummaryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
          description: Missing or invalid from/to dates

  /reports/department-staffing:
    get:
      tags: [Reports]
      operationId: departmentStaffing
      summary: Department staffing breakdown by current role
      description: |
        Returns headcount per department per role, counting only active employees
        with a current role assignment (effective_to IS NULL).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staffing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_DepartmentStaffingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/shift-coverage-gaps:
    get:
      tags: [Reports]
      operationId: shiftCoverageGaps
      summary: Shift coverage gap report
      description: |
        Detects shifts with zero staff assigned, full no-shows (everyone assigned
        was absent), and partial coverage — using a generated date series cross
        joined with shifts, anti-joined against actual assignments + attendance.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
      responses:
        '200':
          description: Coverage gap data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_ShiftCoverageGapList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
          description: Missing or invalid from/to dates

  # ─── Users (super_admin only) ─────────────────────────
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List all user accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list (password hashes stripped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_UserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      operationId: createUser
      summary: Create a new user account
      description: |
        Role must be `hr_manager` or `staff`. Creating a `super_admin` via the
        API is explicitly rejected — use `admin.exe createsuperuser` instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created (password hash stripped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'

    get:
      tags: [Users]
      operationId: getUser
      summary: Get user by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User (password hash stripped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      operationId: updateUser
      summary: Update a user account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user (password hash stripped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user account
      description: Cannot delete a super_admin user via API.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Audit Logs ───────────────────────────────────────
  /audit-logs:
    get:
      tags: [Audit Logs]
      operationId: listAuditLogs
      summary: List audit log entries
      security:
        - bearerAuth: []
      parameters:
        - name: entity_type
          in: query
          schema:
            type: string
          description: Filter by entity type (e.g. employee, role, shift)
        - name: entity_id
          in: query
          schema:
            type: integer
            format: int64
          description: Filter by entity ID
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter entries after this timestamp (RFC3339)
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter entries before this timestamp (RFC3339)
      responses:
        '200':
          description: Audit log list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_AuditLogList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ═══════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════
components:
  # ─── Security ───────────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ─── Parameters ─────────────────────────────────────
  parameters:
    EmployeeID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Employee ID
    DepartmentID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Department ID
    RoleID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Role ID
    ShiftID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Shift ID
    ShiftAssignmentID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Shift Assignment ID
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: User ID

  # ─── Reusable Responses ─────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already exists (duplicate name, email, etc.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidState:
      description: Invalid state for the requested operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed (missing fields, bad format)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ─── Schemas ────────────────────────────────────────
  schemas:
    # ── Enums ──
    EmployeeStatus:
      type: string
      enum: [active, inactive, terminated]

    AttendanceStatus:
      type: string
      enum: [present, late, absent, half_day]

    UserRole:
      type: string
      enum: [super_admin, hr_manager, staff]

    # ── Error ──
    Error:
      type: object
      properties:
        error:
          type: string
          example: resource not found

    # ── Response Wrappers ──
    Response_TokenPair:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'

    Response_Employee:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Employee'

    Response_EmployeeList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'

    Response_Department:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Department'

    Response_DepartmentList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'

    Response_Role:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Role'

    Response_RoleList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Response_Shift:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Shift'

    Response_ShiftList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Shift'

    Response_ShiftAssignment:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ShiftAssignment'

    Response_ShiftAssignmentList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShiftAssignment'

    Response_Attendance:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Attendance'

    Response_AttendanceList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Attendance'

    Response_User:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'

    Response_UserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'

    Response_AuditLogList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'

    Response_MonthlyAttendanceSummaryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyAttendanceSummary'

    Response_DepartmentStaffingList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentStaffing'

    Response_ShiftCoverageGapList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ShiftCoverageGap'

    Response_Message:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: department updated

    # ── Domain Models ──
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: Short-lived JWT (15 min default)
        refresh_token:
          type: string
          description: Longer-lived JWT (7 days default)

    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Front Desk
        description:
          type: string
          nullable: true
          example: Handles guest check-in and check-out
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Manager
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Employee:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_code:
          type: string
          example: EMP001
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@hotel.com
        phone:
          type: string
          nullable: true
          example: "+1234567890"
        department_id:
          type: integer
          format: int64
          nullable: true
        hire_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/EmployeeStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        department:
          $ref: '#/components/schemas/Department'
          nullable: true
          description: Joined department (only on single-employee GET)
        current_role:
          $ref: '#/components/schemas/Role'
          nullable: true
          description: Current role (only on single-employee GET)

    EmployeeRole:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_id:
          type: integer
          format: int64
        role_id:
          type: integer
          format: int64
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
          nullable: true
          description: null = currently active
        created_at:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/Role'
          nullable: true

    Shift:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Morning
        start_time:
          type: string
          format: date-time
          description: Time of day (date portion ignored)
          example: "0001-01-01T06:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "0001-01-01T14:00:00Z"
        created_at:
          type: string
          format: date-time

    ShiftAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_id:
          type: integer
          format: int64
        shift_id:
          type: integer
          format: int64
        work_date:
          type: string
          format: date
        created_by:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time

    Attendance:
      type: object
      properties:
        id:
          type: integer
          format: int64
        shift_assignment_id:
          type: integer
          format: int64
        check_in_time:
          type: string
          format: date-time
          nullable: true
        check_out_time:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        notes:
          type: string
          nullable: true
        recorded_by:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employee_id:
          type: integer
          format: int64
          nullable: true
        username:
          type: string
          example: admin
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor_user_id:
          type: integer
          format: int64
          nullable: true
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        entity_type:
          type: string
          example: employee
        entity_id:
          type: integer
          format: int64
          nullable: true
        before_data:
          type: object
          nullable: true
          additionalProperties: true
        after_data:
          type: object
          nullable: true
          additionalProperties: true
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    MonthlyAttendanceSummary:
      type: object
      properties:
        employee_id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        department:
          type: string
        present_count:
          type: integer
          format: int64
        late_count:
          type: integer
          format: int64
        absent_count:
          type: integer
          format: int64
        half_day_count:
          type: integer
          format: int64
        attendance_rate_pct:
          type: number
          format: float
          description: Percentage of present+late vs total shifts
          example: 87.5

    DepartmentStaffing:
      type: object
      properties:
        department:
          type: string
        role:
          type: string
        headcount:
          type: integer
          format: int64

    ShiftCoverageGap:
      type: object
      properties:
        work_date:
          type: string
          format: date
        shift_name:
          type: string
        assigned_count:
          type: integer
          format: int64
        attended_count:
          type: integer
          format: int64
        coverage_status:
          type: string
          enum: [NO_STAFF_ASSIGNED, FULL_NO_SHOW, PARTIAL_COVERAGE, OK]
          description: |
            - NO_STAFF_ASSIGNED: no employees assigned to this shift
            - FULL_NO_SHOW: all assigned employees were absent
            - PARTIAL_COVERAGE: some assigned employees were absent
            - OK: full coverage

    # ── Request Bodies ──
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: secret123

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    CreateEmployeeRequest:
      type: object
      required: [employee_code, first_name, last_name, email, hire_date]
      properties:
        employee_code:
          type: string
          example: EMP001
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john.doe@hotel.com
        phone:
          type: string
          example: "+1234567890"
        department_id:
          type: integer
          format: int64
          nullable: true
        hire_date:
          type: string
          format: date
          example: "2024-01-15"
        status:
          $ref: '#/components/schemas/EmployeeStatus'

    UpdateEmployeeRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        department_id:
          type: integer
          format: int64
          nullable: true
        hire_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/EmployeeStatus'

    CreateDepartmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Housekeeping
        description:
          type: string
          example: Responsible for room cleaning and maintenance

    UpdateDepartmentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Supervisor
        description:
          type: string

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    CreateShiftRequest:
      type: object
      required: [name, start_time, end_time]
      properties:
        name:
          type: string
          example: Morning
        start_time:
          type: string
          description: "Time of day (HH:MM:SS)"
          example: "06:00:00"
        end_time:
          type: string
          description: "Time of day (HH:MM:SS)"
          example: "14:00:00"

    UpdateShiftRequest:
      type: object
      properties:
        name:
          type: string
        start_time:
          type: string
          description: "Time of day (HH:MM:SS)"
        end_time:
          type: string
          description: "Time of day (HH:MM:SS)"

    CreateShiftAssignmentRequest:
      type: object
      required: [employee_id, shift_id, work_date]
      properties:
        employee_id:
          type: integer
          format: int64
        shift_id:
          type: integer
          format: int64
        work_date:
          type: string
          format: date
          description: "Date (YYYY-MM-DD)"
          example: "2024-03-15"

    CheckInRequest:
      type: object
      required: [shift_assignment_id, check_in_time]
      properties:
        shift_assignment_id:
          type: integer
          format: int64
        check_in_time:
          type: string
          format: date-time
          description: RFC3339 timestamp
          example: "2024-03-15T06:05:00Z"

    CheckOutRequest:
      type: object
      required: [shift_assignment_id, check_out_time]
      properties:
        shift_assignment_id:
          type: integer
          format: int64
        check_out_time:
          type: string
          format: date-time
          description: RFC3339 timestamp
          example: "2024-03-15T14:00:00Z"

    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        employee_id:
          type: integer
          format: int64
          nullable: true
          description: Optional link to an employee record
        username:
          type: string
          example: jdoe
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/UserRole'
          description: "Must be hr_manager or staff (super_admin is rejected)"

    UpdateUserRequest:
      type: object
      properties:
        employee_id:
          type: integer
          format: int64
          nullable: true
        username:
          type: string
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/UserRole'
          description: "Must be hr_manager or staff (super_admin is rejected)"
        is_active:
          type: boolean
