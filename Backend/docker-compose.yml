version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-hotel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hotel}
      POSTGRES_DB: ${DB_NAME:-hotel_ems}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hotel} -d ${DB_NAME:-hotel_ems}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/main.exe"]

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    environment:
      - DATABASE_URL=${DATABASE_URL}
    profiles:
      - admin
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/admin.exe"]

volumes:
  postgres_data:
